name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.0
      GOFLAGS: -buildvcs=false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK, but its cmdline-tools/sdkmanager
      # aren't on PATH by default — this puts them there and sets ANDROID_HOME.
      - uses: android-actions/setup-android@v3
        with:
          # The retired SDK tools package is no longer available.
          packages: platform-tools

      - name: Accept Android SDK licenses
        # `yes` keeps writing after sdkmanager stops reading once all licenses
        # are accepted, which SIGPIPEs this step even on success — the real
        # proof is whether the install step below succeeds, so don't fail here.
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK platform, build-tools and NDK
        # The NDK download is ~1GB; retry a few times against transient
        # network failures before giving up for real.
        run: |
          for i in 1 2 3; do
            sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;26.1.10909125" && exit 0
            echo "sdkmanager install failed (attempt $i/3), retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Install gomobile
        run: |
          # Match the mobile dependency used to build the app; init installs gobind@latest.
          mobile_version="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${mobile_version}"
          go install "golang.org/x/mobile/cmd/gobind@${mobile_version}"

      # Same command as `make android` — the Kotlin sources import the
      # gomobile-generated `mobile.Mobile` API, so nothing compiles (tests
      # included) until this AAR exists.
      - name: Build gomobile AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -ldflags="-extldflags=-Wl,-z,max-page-size=16384" -target android -androidapi 21 -o android/app/libs/mobile.aar zyrln/platforms/mobile

      - name: Verify Android builds, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease
